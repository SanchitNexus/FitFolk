<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-sarah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="skin-sarah" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE0D9" />
      <stop offset="100%" stop-color="#F2B5A7" />
    </linearGradient>
    <linearGradient id="hair-sarah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#bg-sarah)" />
  
  <!-- Clinical Athletic Jacket / Scrubs -->
  <path d="M40,200 C40,150 68,136 100,136 C132,136 160,150 160,200 Z" fill="#0D9488" />
  <path d="M82,148 L100,180 L118,148 Z" fill="#FDE0D9" />
  <path d="M92,165 L100,180 L108,165 Z" fill="#FFFFFF" />
  
  <!-- Stethoscope around neck -->
  <path d="M72,145 C70,175 82,192 100,192 C118,192 130,175 128,145" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <circle cx="100" cy="192" r="6" fill="#CBD5E1" stroke="#475569" stroke-width="2" />
  
  <!-- Neck -->
  <rect x="88" y="112" width="24" height="30" rx="5" fill="url(#skin-sarah)" />
  <path d="M88,124 C95,128 105,128 112,124 L112,134 L88,134 Z" fill="#E29D8F" opacity="0.4" />
  
  <!-- Hair: Side strands and professional styling -->
  <path d="M64,80 C60,120 70,140 78,145 C72,130 68,105 72,85 Z" fill="url(#hair-sarah)" />
  <path d="M136,80 C140,120 130,140 122,145 C128,130 132,105 128,85 Z" fill="url(#hair-sarah)" />
  
  <!-- Head & Ears -->
  <circle cx="68" cy="95" r="8" fill="url(#skin-sarah)" />
  <circle cx="132" cy="95" r="8" fill="url(#skin-sarah)" />
  <ellipse cx="100" cy="92" rx="32" ry="36" fill="url(#skin-sarah)" />
  
  <!-- Hair on top with neat part -->
  <path d="M68,78 C68,48 82,42 100,42 C118,42 132,48 132,78 C122,68 110,65 100,65 C85,65 75,70 68,78 Z" fill="url(#hair-sarah)" />
  
  <!-- Eyebrows -->
  <path d="M78,81 Q86,77 94,81" stroke="#451A03" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M106,81 Q114,77 122,81" stroke="#451A03" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Friendly Intelligent Eyes -->
  <ellipse cx="86" cy="88" rx="4.5" ry="5" fill="#1E293B" />
  <ellipse cx="114" cy="88" rx="4.5" ry="5" fill="#1E293B" />
  <circle cx="87.5" cy="86.5" r="1.5" fill="#FFFFFF" />
  <circle cx="115.5" cy="86.5" r="1.5" fill="#FFFFFF" />
  
  <!-- Nose -->
  <path d="M98,92 Q100,99 103,99" stroke="#D18373" stroke-width="2" stroke-linecap="round" fill="none" />
  
  <!-- Warm Doctor Smile -->
  <path d="M88,109 Q100,120 112,109" stroke="#991B1B" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M91,109 Q100,116 109,109 Z" fill="#FFFFFF" />
</svg>